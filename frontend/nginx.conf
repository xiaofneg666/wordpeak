# WordVerse 前端 nginx 配置:
# - 托管 vite 构建产物 dist(SPA 前端路由回退到 index.html)
# - /api 反向代理到后端容器(compose 服务名 backend),与开发期
#   vite(5173)直连 localhost:8000 的行为保持一致:页面只请求同源 /api
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip 压缩静态资源
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # API 反代到后端容器(路径原样透传:/api/xxx → backend:8000/api/xxx)
  location /api {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # SPA 前端路由:找不到的路径回退 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
